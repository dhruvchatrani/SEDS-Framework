[project]
name = "maes-simulation"
version = "0.1.0"
description = "Multi-Agent Enterprise Simulation (MAES) Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MAES Development Team"}
]
dependencies = [
    "langgraph",
    "langchain",
    "neo4j",
    "chromadb",
    "pydantic",
    "python-dotenv",
    "psycopg2-binary",
    "langchain-google-genai",
    "mcp"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
